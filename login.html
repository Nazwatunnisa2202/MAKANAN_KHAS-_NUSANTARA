<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Kuliner Nusantara</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4b2413, #a45b2a);
            padding: 20px;
        }

        .container {
            width: 900px;
            min-height: 520px;
            display: flex;
            background: #fffaf2;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px #0004;
        }

        /* BAGIAN KIRI */
        .kiri {
            width: 50%;
            background: linear-gradient(
                rgba(65, 31, 15, 0.82),
                rgba(100, 47, 20, 0.88)
            ),
            url("gambar-rendang.jpg") center/cover;

            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 35px;
        }

        .logo {
            font-size: 65px;
            margin-bottom: 15px;
        }

        .kiri h1 {
            font-family: Georgia, serif;
            font-size: 31px;
            line-height: 1.4;
            margin-bottom: 15px;
        }

        .kiri p {
            font-size: 13px;
            line-height: 1.9;
            color: #fff0d5;
        }

        .garis {
            width: 65px;
            height: 4px;
            background: #f4c15d;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .tagline {
            margin-top: 20px;
            color: #f4c15d;
            font-size: 13px;
            font-style: italic;
        }

        /* BAGIAN KANAN */
        .kanan {
            width: 50%;
            padding: 45px 35px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .kanan h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #61351e;
            font-size: 28px;
        }

        .deskripsi {
            text-align: center;
            font-size: 13px;
            color: #827264;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #4b382a;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #dfc9b2;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
            background: white;
        }

        input:focus {
            border-color: #a45b2a;
            box-shadow: 0 0 4px #a45b2a55;
        }

        .lupa {
            text-align: right;
            margin-top: -8px;
            margin-bottom: 22px;
        }

        .lupa a {
            text-decoration: none;
            color: #a45b2a;
            font-size: 12px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #87451f;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #4b2413;
        }

        .daftar {
            text-align: center;
            margin-top: 22px;
            font-size: 12px;
            color: #827264;
        }

        .daftar a {
            color: #a45b2a;
            text-decoration: none;
            font-weight: bold;
        }

        .kembali {
            text-align: center;
            margin-top: 18px;
        }

        .kembali a {
            color: #87451f;
            text-decoration: none;
            font-size: 12px;
        }

        /* TAMPILAN HP */
        @media (max-width: 650px) {
            .container {
                flex-direction: column;
                width: 100%;
            }

            .kiri, .kanan {
                width: 100%;
            }

            .kiri {
                min-height: 280px;
            }

            .kiri h1 {
                font-size: 25px;
            }

            .logo {
                font-size: 50px;
            }

            .kanan {
                padding: 30px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- IDENTITAS KULINER NUSANTARA -->
        <div class="kiri">

            <div class="logo">🍲</div>

            <div class="garis"></div>

            <h1>Kuliner Nusantara</h1>

            <p>
                Portal Berita Kuliner Indonesia<br>
                Mengenal Makanan Khas Daerah<br>
                Menjelajahi Cita Rasa Nusantara
            </p>

            <div class="tagline">
                "Menjelajahi Rasa, Melestarikan Budaya"
            </div>

        </div>

        <!-- FORM LOGIN -->
        <div class="kanan">

            <h2>Sign In</h2>

            <p class="deskripsi">
                Masuk untuk membaca berita kuliner terbaru.
            </p>

            <form onsubmit="login(event)">

                <label for="username">Username / Email</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Masukkan username atau email"
                    required
                >

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Masukkan password"
                    required
                >

                <div class="lupa">
                    <a href="#" onclick="lupaPassword(event)">
                        Lupa Password?
                    </a>
                </div>

                <button type="submit">Sign In →</button>

            </form>

            <p class="daftar">
                Belum mempunyai akun?
                <a href="#" onclick="daftarAkun(event)">
                    Daftar di sini
                </a>
            </p>

            <div class="kembali">
                <a href="index.html">← Kembali ke Beranda</a>
            </div>

        </div>

    </div>

    <script>
        function login(event) {
            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            if (username !== "" && password !== "") {
                alert("Selamat datang di Kuliner Nusantara!");

                window.location.href = "index.html";
            }
        }

        function lupaPassword(event) {
            event.preventDefault();

            alert(
                "Untuk bantuan password, silakan hubungi pengelola website."
            );
        }

        function daftarAkun(event) {
            event.preventDefault();

            alert(
                "Fitur pendaftaran akun belum tersedia pada versi demo."
            );
        }
    </script>

</body>
</html>
